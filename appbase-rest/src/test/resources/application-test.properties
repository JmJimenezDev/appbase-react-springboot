spring.application.name=appbase-rest
server.port=8080

# H2 Test Database
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# LOG
logging.level.root=WARN
logging.level.dev.jmjimenez=DEBUG
logging.level.org.springframework.security=WARN

# RATE LIMITING - disable for tests
ratelimit.general.limit=1000
ratelimit.general.duration=1
ratelimit.login.limit=100
ratelimit.login.duration=5
ratelimit.ban.duration=20

# SECURITY
jwt.secret=L3MwLdrVYWL1FNQ7uNIXJAkR+SLF42sRX6naKPqcQUxUJHV33iFy81M3j5ej+UmecrzkpSWT5afB4rFtmN79Og==
jwt.access.expiration=900000
jwt.refresh.expiration=604800000

# CORS
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# OPEN_API
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui
springdoc.swagger-ui.operationsSorter=method
